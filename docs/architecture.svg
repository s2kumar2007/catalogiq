<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>CatalogIQ architecture: six-stage enrichment pipeline</title>
  <desc>Raw catalog row flows through Classify, Extract, Enrich, Normalize, Format, and Validate/Score stages to produce a 252-column Unilog delivery record.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#5B5A55" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="900" height="420" fill="#FFFFFF"/>

  <!-- Input -->
  <rect x="20" y="170" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="80" y="192" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">Raw CSV row</text>
  <text x="80" y="208" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Messy input</text>

  <line x1="140" y1="198" x2="172" y2="198" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 1: Classify, Extract, Enrich -->
  <g>
    <rect x="176" y="60" width="150" height="66" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="251" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">1. Classify</text>
    <text x="251" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3C3489">Classpath + dynamic</text>
    <text x="251" y="119" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3C3489">attribute schema</text>
  </g>

  <g>
    <rect x="176" y="177" width="150" height="66" rx="8" fill="#EEEDFE" stroke="#7F77DD" stroke-width="1"/>
    <text x="251" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#26215C">2. Extract</text>
    <text x="251" y="223" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3C3489">Real values + brand</text>
    <text x="251" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3C3489">vs distributor split</text>
  </g>

  <g>
    <rect x="176" y="294" width="150" height="66" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
    <text x="251" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#04342C">3. Enrich</text>
    <text x="251" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F6E56">Live web search on</text>
    <text x="251" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#0F6E56">verified mfr domain</text>
  </g>

  <!-- connectors: input branches to all three, then converge -->
  <path d="M172 198 L155 198 L155 93 L172 93" fill="none" stroke="#5B5A55" stroke-width="1" opacity="0"/>
  <line x1="80" y1="198" x2="80" y2="93" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="80" y1="93" x2="172" y2="93" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="80" y1="198" x2="172" y2="210" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="80" y1="198" x2="80" y2="327" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="80" y1="327" x2="172" y2="327" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Row 2: Normalize, Format, Validate/Score -->
  <line x1="326" y1="93" x2="360" y2="93" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="326" y1="210" x2="360" y2="210" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>
  <line x1="326" y1="327" x2="360" y2="327" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <line x1="80" y1="93" x2="80" y2="93" stroke="none"/>

  <!-- vertical merge lines into Normalize -->
  <line x1="513" y1="93" x2="513" y2="150" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="513" y1="327" x2="513" y2="270" stroke="#B4B2A9" stroke-width="1"/>

  <g>
    <rect x="360" y="60" width="150" height="66" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="435" y="88" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">4. Normalize</text>
    <text x="435" y="106" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">Canonical brand,</text>
    <text x="435" y="119" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">UOM, placeholders out</text>
  </g>

  <g>
    <rect x="360" y="177" width="150" height="66" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="435" y="205" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">5. Format</text>
    <text x="435" y="223" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">Assembles full</text>
    <text x="435" y="236" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">252-column record</text>
  </g>

  <g>
    <rect x="360" y="294" width="150" height="66" rx="8" fill="#FAECE7" stroke="#D85A30" stroke-width="1"/>
    <text x="435" y="322" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#4A1B0C">6. Validate / Score</text>
    <text x="435" y="340" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">Char limits, blind vs.</text>
    <text x="435" y="353" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#993C1D">spot-check accuracy</text>
  </g>

  <line x1="510" y1="93" x2="530" y2="93" stroke="#5B5A55" stroke-width="1.2"/>
  <line x1="510" y1="210" x2="530" y2="210" stroke="#5B5A55" stroke-width="1.2"/>
  <line x1="510" y1="327" x2="530" y2="327" stroke="#5B5A55" stroke-width="1.2"/>
  <line x1="530" y1="93" x2="530" y2="327" stroke="#B4B2A9" stroke-width="1"/>
  <line x1="530" y1="210" x2="580" y2="210" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- External services callouts -->
  <rect x="176" y="0" width="150" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="251" y="21" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Groq LLM</text>
  <line x1="251" y1="34" x2="251" y2="58" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>

  <rect x="176" y="396" width="150" height="0" fill="none"/>
  <rect x="176" y="373" width="150" height="34" rx="6" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.8"/>
  <text x="251" y="394" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Tavily search</text>
  <line x1="251" y1="373" x2="251" y2="362" stroke="#B4B2A9" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Output -->
  <rect x="580" y="177" width="150" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1"/>
  <text x="655" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#173404">Delivery record</text>
  <text x="655" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3B6D11">252 columns,</text>
  <text x="655" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#3B6D11">Unilog format</text>

  <line x1="730" y1="210" x2="762" y2="210" stroke="#5B5A55" stroke-width="1.2" marker-end="url(#arrow)"/>

  <rect x="766" y="177" width="114" height="66" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
  <text x="823" y="200" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A">CSV / Excel</text>
  <text x="823" y="218" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">Downloadable</text>
  <text x="823" y="231" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#5F5E5A">output</text>

</svg>
